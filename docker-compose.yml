services:
  app:
    image: ${DOCKER_IMAGE:-devops-task:1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SHUTDOWN_TIMEOUT: "20"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
