name: Publish and deploy

on:
  push:
    branches: [production]

permissions:
  contents: read

# Never cancel a remote deployment midway through its rollback handling.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish multi-architecture image and deploy through SSM
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration and version
        id: version
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set production variable AWS_REGION}"
          : "${AWS_ROLE_ARN:?Set production variable AWS_ROLE_ARN}"
          : "${ECR_REPOSITORY:?Set production variable ECR_REPOSITORY}"
          : "${EC2_INSTANCE_ID:?Set production variable EC2_INSTANCE_ID}"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # A unique semantic prerelease version for every production build and rerun.
          echo "tag=${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-devops-deploy
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Deploy exact image digest via SSM
        id: ssm
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/ssm_payload.py > /tmp/ssm-command.json
          command_id=$(aws ssm send-command --cli-input-json file:///tmp/ssm-command.json --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id" >> "$GITHUB_STEP_SUMMARY"
          # Poll longer than the AWS CLI's default command-executed waiter.
          for ((attempt=1; attempt<=120; attempt++)); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deployment status: $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for SSM; inspect the command before retrying.'
          exit 1
      - name: Save deployment evidence
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" > deployment-result.json
          cat deployment-result.json
          {
            echo '### Deployment'
            echo "Image: $IMAGE"
            echo '```json'
            cat deployment-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: warn
          retention-days: 90
