name: Publish and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Publish multi-architecture image to GHCR
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name and version
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  deploy:
    name: Deploy to EC2 through SSH
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate SSH configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/home/ubuntu/devops-assessment' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          : "${SERVER_HOST:?Set SERVER_HOST secret}"
          : "${SERVER_USER:?Set SERVER_USER secret}"
          : "${SERVER_PATH:?Set SERVER_PATH secret}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY secret}"
      - name: Pull and deploy exact image
        uses: appleboy/ssh-action@v1
        env:
          TARGET_DIR: ${{ secrets.SERVER_PATH || '/home/ubuntu/devops-assessment' }}
          DEPLOY_SHA: ${{ github.sha }}
          DOCKER_IMAGE: ${{ needs.build.outputs.image_uri }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: TARGET_DIR,DEPLOY_SHA,DOCKER_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -eu
            : "${TARGET_DIR:?SERVER_PATH is required}"
            : "${DOCKER_IMAGE:?Image URI is required}"
            cd "$TARGET_DIR"
            # Also serialize any deployments started outside this workflow.
            exec 9>"$HOME/.devops-task-deploy.lock"
            flock -w 300 9
            git fetch origin --tags
            git checkout --detach "$DEPLOY_SHA"
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" --password-stdin
            export DOCKER_IMAGE
            export ENVIRONMENT=production
            docker compose pull app
            docker compose up -d --no-deps --no-build \
              --wait --wait-timeout 120 app
            docker compose ps app
