name: CI

on:
  pull_request:
  push:
    branches: [development]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python lint, tests, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - name: Tests and coverage gate
        run: |
          set -o pipefail
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=85 | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          if test -f coverage.txt; then
            {
              echo '### Test coverage'
              echo '```text'
              cat coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            coverage.xml
            coverage.txt
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  lint-infrastructure:
    name: Dockerfile and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199 hadolint - < Dockerfile
      - name: ShellCheck (all shell scripts)
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find scripts -type f -name '*.sh' -size +0c -print0 | xargs -0 -r shellcheck --severity=style

  image:
    name: Build and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: devops-task:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Scan image (fail on all CRITICAL vulnerabilities)
        run: |
          set -o pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image \
            --scanners vuln --severity CRITICAL --exit-code 1 \
            --format table devops-task:ci | tee trivy-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: trivy-report.txt
          retention-days: 14


  terraform:
    name: Terraform offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test -no-color
      - run: terraform -chdir=terraform/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform/bootstrap validate
